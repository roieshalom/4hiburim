    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grooped</title>

    <!-- Favicon + touch icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cookie&display=swap">
</head>

<body>
  <!-- AI banner -->
  <div class="ai-banner" role="status">
    <span class="ai-banner__content">✨ Some puzzles are generated with AI</span>
    <button class="about-btn" id="about-btn" aria-label="About">i</button>
  </div>

  <div class="container">
    <!-- Header: title + trophy counter -->
    <div class="header-row">
      <h1>Grooped</h1>
      <div class="solve-counter">
        <span class="solve-counter__icon">🏆</span>
        <span class="solve-counter__value" id="trophy-count">0</span>
      </div>
    </div>

    <p class="directions">Make four groups of four words</p>

    <!-- Solved categories bar -->
    <div id="solved-categories" class="solved-categories"></div>

    <!-- Overlay message that appears over the board -->
    <div id="message-overlay" class="message-overlay"></div>

    <!-- Game board -->
    <div id="game-board" class="game-board">
      <!-- Words will be inserted here by JavaScript -->
    </div>

    <!-- Stats -->
    <div class="stats">
      <p>Attempts: <span id="mistakes">0</span> / 4</p>
    </div>

<div class="controls">
  <button id="deselect-btn" type="button" disabled>
    <span class="icon icon-clear" aria-hidden="true"></span>
  </button>


  <button id="submit-btn" type="button" disabled>
    <span class="label">Submit</span>
  </button>

  <button id="shuffle-btn" type="button">
    <span class="icon icon-shuffle" aria-hidden="true"></span>
  </button>
</div>


  <!-- About modal (must be before game.js so getElementById finds it at parse time) -->
  <div class="about-modal" id="about-modal">
    <div class="about-content">
      <button class="about-close" id="about-close">×</button>
      <h2>Grooped</h2>
      <p>A daily word puzzle game</p>
      <div class="about-links">
        <a href="https://roiesh.com/grooped.html?utm_source=grooped&utm_medium=game&utm_campaign=about_modal"
           target="_blank" rel="noopener" id="about-link-portfolio">About the project</a>
        <a href="https://grooped-puzzle-generator.vercel.app/"
           target="_blank" rel="noopener" id="about-link-editor">Behind the scenes</a>
      </div>
      <button class="contact-link" id="contact-link">Contact me</button>
    </div>
  </div>

  <!-- Contact overlay (sits on top of the about modal) -->
  <div class="contact-overlay" id="contact-overlay">
    <div class="contact-content">
      <button class="about-close" id="contact-close">×</button>
      <h3>Get in touch</h3>
      <form id="contact-form" novalidate>
        <div class="cf-field">
          <label for="cf-name">Name <span class="cf-req">*</span></label>
          <input id="cf-name" name="name" type="text" required autocomplete="name" placeholder="Your name">
        </div>
        <div class="cf-field">
          <label for="cf-email">Email</label>
          <input id="cf-email" name="email" type="email" autocomplete="email" placeholder="your@email.com">
        </div>
        <div class="cf-field">
          <label for="cf-message">Message <span class="cf-req">*</span></label>
          <textarea id="cf-message" name="message" required rows="4" placeholder="Say something…"></textarea>
        </div>
        <button class="cf-submit" type="submit" id="cf-submit">Send</button>
        <p class="cf-status" id="cf-status"></p>
      </form>
    </div>
  </div>

  <script src="game.js"></script>

</body>
</html>
